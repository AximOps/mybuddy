<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · Amiroon</title>
<style>
  :root { color-scheme: light dark; --bg: #f4f5fb; --ink: #14163a; --muted: #6b7090; --card: #fff; --line: #e6e8f2; --accent: #4b5be8; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0c0e23; --ink: #eef0fb; --muted: #9499bd; --card: #14173a; --line: #252a55; --accent: #8795ff; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .card { max-width: 400px; text-align: center; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 32px 26px; }
  img { width: 64px; height: 64px; border-radius: 16px; }
  h1 { font-size: 22px; margin: 16px 0 6px; }
  p { color: var(--muted); margin: 0 0 18px; }
  button { height: 42px; padding: 0 18px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
  <main class="card">
    <img src="/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>Pages you opened recently are still available. Connect to the internet to see new changes and save your work.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
